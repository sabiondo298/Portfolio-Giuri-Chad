<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Juan Giuri Portfolio</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel ="icon" href ="assets/letter-j.png" type ="image/x-icon">
</head>
<body>
    <header class="topographic-strip">
        <a class="home-icon" href="index.html" aria-label="Ir al inicio" title="Inicio">
            <i class="bi bi-house-fill"></i>
        </a>

        <nav class="nav-links" aria-label="Navegación principal">
            <a href="#Myself">Myself</a>
            <a href="#Projects">Projects</a>
            <a href="#Contact">Contact</a>
        </nav>
    </header>

    <main class="portfolio-layout">
        <section class="profile-panel" aria-labelledby="profile-title">
            <h1 id="profile-title">Juan Giuri</h1>
            <div class="portrait-frame">
                <img src="assets/pancho123.png" alt="Retrato de Juan Giuri">
            </div>
        </section>

        <section class="content-panels" aria-label="Secciones del portfolio">
            <button class="content-panel content-panel--expandable" type="button" aria-expanded="false" aria-controls="myself-content">
                <span class="panel-label">Myself</span>
                <span class="panel-arrow" aria-hidden="true">+</span>
                <span class="panel-content" id="myself-content">
                    <span class="panel-paragraph">Soy un estudiante de 17 años con interés en seguir creciendo, aprender y enfrentar nuevos desafíos. Me motiva participar en proyectos que me permitan poner en práctica mis conocimientos, desarrollar nuevas habilidades y adquirir experiencia en diferentes áreas.</span>
                    <span class="panel-paragraph">Me considero una persona comprometida con ganas de aprender. Busco nuevas oportunidades y proyectos en los que pueda aportar mis ideas, trabajar en equipo y continuar construyendo mi perfil profesional desde una etapa temprana.</span>
                    <span class="panel-paragraph">Mi objetivo es seguir desarrollándome constantemente y aprovechar cada proyecto como una oportunidad para aprender algo nuevo y acercarme a mis metas profesionales.</span>
                </span>
            </button>
            <button class="content-panel" type="button">Projects</button>
            <button class="content-panel" type="button">Contact</button>
        </section>
    </main>

    <script>
        requestAnimationFrame(() => document.body.classList.add("page-ready"));

        const myselfPanel = document.querySelector(".content-panel--expandable");

        myselfPanel.addEventListener("click", () => {
            const isExpanded = myselfPanel.classList.toggle("is-expanded");
            myselfPanel.parentElement.classList.toggle("has-expanded", isExpanded);
            myselfPanel.setAttribute("aria-expanded", String(isExpanded));
        });
    </script>
</body>
</html>
